---
layout: default
title: 我的批注
permalink: /annotations/
annotation_manager: true
---
<section class="am-page" aria-labelledby="am-title">
  <header class="am-hero"><div><p class="am-eyebrow">HAPPYCAT · READING NOTES</p><h1 id="am-title">把读过的，变成自己的。</h1><p class="am-subtitle">所有文章里的思考、疑问与小小发现，都收在这里。</p></div><div class="am-backups"><button type="button" id="am-export">导出全部</button><button type="button" id="am-import">导入备份</button><input id="am-file" type="file" accept=".json,application/json" hidden></div></header>
  <div class="am-local"><span aria-hidden="true">○</span> 我的批注 · 仅保存在当前浏览器，不公开、不自动同步。换设备前，可导出备份。</div>
  <div class="am-stats" aria-label="批注概览"><div><strong id="am-total">0</strong><span>条批注</span></div><div><strong id="am-articles">0</strong><span>篇文章</span></div><div><strong id="am-deleted">0</strong><span>条可恢复</span></div></div>
  <p id="am-status" class="am-status" role="status" aria-live="polite"></p><p id="am-warning" class="am-warning" role="alert" hidden></p>
  <div class="am-layout"><aside class="am-sidebar" aria-label="按文章筛选"><div class="am-side-title">我的书页</div><div id="am-article-list"></div><p class="am-side-help">点击文章查看批注。<br>返回原文，可以继续阅读和标记。</p></aside>
    <section class="am-main" aria-label="批注列表"><div class="am-filters"><div class="am-search"><label for="am-search">搜索批注</label><input id="am-search" type="search" placeholder="搜索文章、原文或你的想法…" autocomplete="off"></div><div class="am-mobile-filter"><label for="am-article">筛选文章</label><select id="am-article"><option value="">全部文章</option></select></div><div><label for="am-sort">排序</label><select id="am-sort"><option value="updated">最近修改</option><option value="created">最近创建</option><option value="oldest">最早创建</option></select></div></div>
    <div class="am-list-header"><div class="am-tabs" role="group" aria-label="批注状态"><button type="button" id="am-active" aria-pressed="true">全部批注</button><button type="button" id="am-trash" aria-pressed="false">回收站</button></div><span id="am-results" aria-live="polite"></span></div>
    <div id="am-list"></div><div id="am-pagination" class="am-pagination"></div></section></div>
  <noscript><p>请启用浏览器 JavaScript 以查看保存在本机的批注。</p></noscript>
</section>
<dialog id="am-editor" class="am-editor" aria-labelledby="am-editor-title"><form id="am-form"><header><h2 id="am-editor-title">编辑批注</h2><button id="am-close" type="button" aria-label="关闭编辑">✕</button></header><p id="am-editor-article"></p><blockquote id="am-editor-quote"></blockquote><label for="am-text">我的想法</label><textarea id="am-text" rows="7" maxlength="5000" required></textarea><p id="am-editor-status" role="status" aria-live="polite"></p><div class="am-edit-actions"><button type="submit" class="am-primary">保存修改</button><button type="button" id="am-cancel">取消</button></div></form></dialog>
<template id="am-index">{% for post in site.posts %}<a data-path="{{ post.url | relative_url | escape }}" data-title="{{ post.title | escape }}" href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>{% endfor %}</template>

<style>
.am-page{padding:54px 0 70px}.am-hero{display:flex;align-items:center;justify-content:space-between;gap:25px}.am-eyebrow{font-size:11px;letter-spacing:2.5px;color:var(--accent);margin-bottom:17px}.am-hero h1{font:500 clamp(28px,3.5vw,42px)/1.45 var(--serif);margin:0 0 13px}.am-subtitle{font-size:14px;color:var(--muted);margin:0}.am-backups{display:flex;gap:10px;flex-shrink:0}.am-page button,.am-editor button{font:13px var(--sans);padding:10px 14px;border:1px solid #cdd5c7;border-radius:6px;background:#fffefa;color:var(--ink);cursor:pointer;line-height:1.5}.am-page button:hover,.am-editor button:hover{background:#edf0e7}.am-page button:disabled{opacity:.45;cursor:default}.am-page button:focus-visible,.am-editor button:focus-visible,.am-page input:focus-visible,.am-page select:focus-visible,.am-editor textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.am-local{display:flex;gap:9px;padding:13px 17px;background:#edf0e7;border-radius:7px;font-size:12px;color:#5f705d;margin-top:26px}.am-local span{color:var(--accent)}.am-stats{display:flex;gap:65px;border-bottom:1px solid var(--line);padding:27px 0 29px;margin-bottom:29px}.am-stats>div{display:flex;gap:11px;align-items:baseline}.am-stats strong{font:500 35px var(--serif)}.am-stats span{font-size:12px;color:var(--muted)}.am-status{font-size:13px;color:#3c6245;background:#e8efdf;padding:12px 16px;border-radius:6px}.am-status:empty{display:none}.am-warning{font-size:13px;color:#974829;background:#faeee1;padding:12px 16px;border-radius:6px}.am-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:35px}.am-side-title{font-size:12px;color:var(--muted);letter-spacing:2px;padding:8px 12px 15px}.am-page .am-article-item{display:flex;text-align:left;justify-content:space-between;gap:15px;width:100%;border:0;background:transparent;padding:13px 12px;margin-bottom:5px;line-height:1.7;overflow-wrap:anywhere}.am-page .am-article-item[aria-pressed=true]{background:#e7ecdf;color:#263e35}.am-article-item small{white-space:nowrap;color:#63725e;font:12px var(--sans);padding-top:4px}.am-side-help{font-size:12px;color:var(--muted);padding:18px 12px;border-top:1px solid var(--line);margin-top:25px}.am-filters{display:flex;gap:12px;align-items:flex-end;margin-bottom:23px}.am-filters>div{min-width:0}.am-search{flex:1}.am-filters label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.am-filters input,.am-filters select{width:100%;padding:12px;border:1px solid #d9dfd1;background:#fffefa;border-radius:7px;font:13px var(--sans);color:var(--ink);min-height:43px}.am-mobile-filter{display:none}.am-list-header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.am-tabs{display:flex;gap:8px}.am-tabs button{border:0;background:transparent;color:var(--muted);padding:9px 12px}.am-tabs button[aria-pressed=true]{color:var(--ink);background:#e7ecdf;font-weight:600}#am-results{font-size:12px;color:var(--muted)}.am-card{background:#fffefa;border:1px solid #e1e5d9;border-radius:11px;padding:24px;margin:0 0 17px}.am-card-top{display:flex;align-items:baseline;justify-content:space-between;gap:18px;margin-bottom:17px}.am-card-top a{font-size:13px;color:#56704f;font-weight:500}.am-card-top time{font-size:11px;color:var(--muted);white-space:nowrap}.am-card blockquote{padding:11px 15px;border-left:3px solid #cca067;background:#f4f0e6;margin:0 0 18px;font:13px/1.9 var(--sans);white-space:pre-wrap;overflow-wrap:anywhere;max-height:135px;overflow:auto}.am-note{font-size:14px;line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:16px}.am-note.am-clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.am-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:15px;border-top:1px solid var(--line)}.am-actions a{color:var(--accent);font-size:12px;margin-right:auto}.am-actions button{font-size:12px;padding:6px 11px}.am-page .am-expand{border:0;padding:0 0 12px;font-size:12px;color:#7f6340;background:transparent}.am-empty{text-align:center;padding:55px 25px;background:#f0f1e9;border:1px dashed #cdd5c6;border-radius:11px}.am-empty h3{font:500 26px var(--serif);margin-bottom:14px}.am-empty p{font-size:13px;color:var(--muted);margin-bottom:20px}.am-empty a{display:inline-block;color:var(--accent);font-size:13px;border-bottom:1px solid #c7a18a}.am-pagination{display:flex;align-items:center;justify-content:center;gap:20px;font-size:12px;color:var(--muted);padding:8px 0}.am-editor{border:1px solid #d5ddce;border-radius:13px;padding:28px;background:var(--paper);color:var(--ink);width:min(590px,calc(100% - 32px));max-height:calc(100dvh - 40px);overflow:auto;font:14px/1.8 var(--sans)}.am-editor::backdrop{background:#1c332b66}.am-editor header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:15px}.am-editor h2{font:500 26px var(--serif);margin:0}.am-editor label{display:block;margin-bottom:8px}.am-editor blockquote{margin:10px 0 20px;border-left:3px solid #cba066;background:#eeeade;padding:12px 16px;max-height:140px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}.am-editor textarea{width:100%;min-height:150px;max-height:40vh;resize:vertical;background:#fffefa;color:var(--ink);border:1px solid #bdcbb5;border-radius:7px;padding:12px;font:14px/1.9 var(--sans)}#am-editor-article{font-size:12px;color:var(--muted)}#am-editor-status{color:var(--accent);font-size:13px}.am-edit-actions{display:flex;gap:10px}.am-editor .am-primary{background:var(--ink);color:white}.am-page [hidden],.am-editor [hidden]{display:none!important}@media(max-width:800px){.am-hero{align-items:flex-start;flex-direction:column}.am-layout{grid-template-columns:minmax(0,1fr)}.am-sidebar{display:none}.am-mobile-filter{display:block;flex:1}.am-filters{flex-wrap:wrap}.am-search{flex-basis:100%}.am-card-top{flex-direction:column;gap:5px}.am-page{padding-top:32px}.am-stats{gap:30px}.am-stats>div{gap:7px}.am-stats strong{font-size:29px}.am-card{padding:20px}.am-local{line-height:1.9}.am-list-header{gap:8px}.am-editor{padding:20px}}@media(max-width:380px){.am-stats{gap:22px}.am-stats>div{flex-direction:column;gap:3px}.am-backups button{font-size:12px}.am-tabs button{padding:8px}.am-hero h1{font-size:27px}}

</style>
<script>
(() => {
  'use strict';
  const PREFIX = 'happycat.annotations.v1:', LIMIT = 500, PAGE_SIZE = 20;
  const $ = id => document.getElementById('am-' + id);
  const index = new Map([...$('index').content.querySelectorAll('a')].map(a => [a.dataset.path, a.dataset.title]));
  let groups = [], rows = [], failures = [], selected = '', trash = false, page = 1, draft = null;
  const expanded = new Set();
  const validPath = p => {
    if (typeof p !== 'string' || !p.startsWith('/posts/') || p.length > 1500 || /[?#\\\s\u0000-\u001f]/.test(p)) return false;
    try { const u = new URL(p, location.origin); return u.origin === location.origin && u.pathname === p && p.endsWith('/'); } catch { return false; }
  };
  const validNote = n => n && typeof n.id === 'string' && /^[\w-]{1,100}$/.test(n.id)
    && typeof n.quote === 'string' && n.quote.trim().length > 0 && n.quote.length <= 2000
    && typeof n.text === 'string' && n.text.trim().length > 0 && n.text.length <= 5000
    && Number.isSafeInteger(n.start) && n.start >= 0
    && typeof n.prefix === 'string' && n.prefix.length <= 80 && typeof n.suffix === 'string' && n.suffix.length <= 80
    && typeof n.createdAt === 'string' && Number.isFinite(Date.parse(n.createdAt))
    && typeof n.updatedAt === 'string' && Number.isFinite(Date.parse(n.updatedAt))
    && (n.deletedAt == null || typeof n.deletedAt === 'string' && Number.isFinite(Date.parse(n.deletedAt)));
  const validNotes = notes => Array.isArray(notes) && notes.length <= LIMIT && notes.every(validNote) && new Set(notes.map(n => n.id)).size === notes.length;
  function read(path) {
    const raw = localStorage.getItem(PREFIX + path);
    if (raw === null) return [];
    const data = JSON.parse(raw);
    if (data.version !== 1 || !validNotes(data.notes)) throw Error('批注格式无效');
    return data.notes;
  }
  const title = path => index.get(path) || '未收录文章 · ' + path;
  const identity = row => row.path + '#' + row.note.id;
  const revision = note => JSON.stringify(note);
  function say(message) { $('status').textContent = message; }
  function load() {
    groups = []; failures = [];
    try {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) { const key = localStorage.key(i); if (key?.startsWith(PREFIX)) keys.push(key); }
      for (const key of keys) {
        const path = key.slice(PREFIX.length);
        try { if (!validPath(path)) throw Error('地址无效'); groups.push({path, notes:read(path)}); }
        catch { failures.push(path || '未知文章'); }
      }
    } catch { failures.push('浏览器存储不可用'); }
    rows = groups.flatMap(g => g.notes.map(note => ({path:g.path, note})));
    $('warning').hidden = !failures.length;
    $('warning').textContent = failures.length ? '部分批注暂时无法读取，原数据未被覆盖：' + failures.map(p => index.get(p) || p).join('；') + '。请检查浏览器存储权限，或先保留已有备份。' : '';
    $('export').disabled = !!failures.length;
    render();
  }
  function el(tag, text, className) { const node = document.createElement(tag); if (text != null) node.textContent = text; if (className) node.className = className; return node; }
  function button(text, onClick) { const b = el('button',text); b.type='button'; b.addEventListener('click',onClick); return b; }
  function link(text, href) { const a = el('a',text); a.href=href; return a; }
  function setArticle(path) { selected=path; page=1; render(); }
  function renderFilters() {
    const active = rows.filter(r => !r.note.deletedAt), deleted = rows.filter(r=>r.note.deletedAt);
    $('total').textContent = active.length; $('articles').textContent = new Set(active.map(r=>r.path)).size; $('deleted').textContent = deleted.length;
    const paths = [...new Set([...rows.map(r=>r.path), ...(selected?[selected]:[])])].sort((a,b)=>title(a).localeCompare(title(b),'zh-CN'));
    const subset = trash ? deleted : active;
    const list = $('article-list'); list.replaceChildren(); $('article').replaceChildren();
    for (const path of ['',...paths]) {
      const count = subset.filter(r=>!path || r.path===path).length;
      const name = path ? title(path) : '全部文章';
      const b=button('',()=>setArticle(path));b.className='am-article-item';b.setAttribute('aria-pressed',String(selected===path));b.append(el('span',name),el('small',String(count)));list.append(b);
      const option=el('option',name+' ('+count+')');option.value=path;$('article').append(option);
    }
    $('article').value=selected;
    $('active').setAttribute('aria-pressed',String(!trash));$('trash').setAttribute('aria-pressed',String(trash));
  }
  function render() {
    renderFilters();
    const query=$('search').value.trim().toLocaleLowerCase();
    const filtered=rows.filter(r=>!!r.note.deletedAt===trash && (!selected||r.path===selected) && (!query || [title(r.path),r.note.quote,r.note.text].some(t=>t.toLocaleLowerCase().includes(query))));
    const sort=$('sort').value;
    filtered.sort((a,b)=> {
      const field=sort==='updated'?(trash?'deletedAt':'updatedAt'):'createdAt';
      const delta=Date.parse(a.note[field])-Date.parse(b.note[field]);
      return (sort==='oldest'?delta:-delta) || identity(a).localeCompare(identity(b));
    });
    const pages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));page=Math.min(page,pages);
    $('results').textContent=filtered.length+' 条'+(trash?'已删除批注':'批注');
    $('list').replaceChildren();$('pagination').replaceChildren();
    if (!filtered.length) {
      const empty=el('div',null,'am-empty');
      const filtering=!!query||!!selected;
      empty.append(el('h3',filtering?'没有找到匹配的批注':trash?'回收站是空的':'让每一次阅读，都留下思考。'),el('p',filtering?'试试其他关键词，或清除筛选条件。':trash?'删除的批注会留在这里，可以随时恢复。':'在文章里选中一行或一段文字，写下想法后，就会自动出现在这里。'));
      if (filtering) empty.append(button('清除筛选',()=>{selected='';$('search').value='';page=1;render();}));
      else empty.append(link('去读一篇文章 ↗','/'));
      $('list').append(empty);
    }
    for (const row of filtered.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE)) {
      const n=row.note, card=el('article',null,'am-card'); card.dataset.path=row.path; card.dataset.noteId=n.id;
      const top=el('div',null,'am-card-top'), time=el('time',new Date(trash?n.deletedAt:n.updatedAt).toLocaleString('zh-CN',{hour12:false}));time.dateTime=trash?n.deletedAt:n.updatedAt;
      top.append(link(title(row.path),row.path),time);card.append(top,el('blockquote',n.quote));
      const text=el('p',n.text,'am-note');if(!expanded.has(identity(row)))text.classList.add('am-clamp');card.append(text);
      if(n.text.length>180||n.text.split('\n').length>5){const more=button(expanded.has(identity(row))?'收起':'展开全文',()=>{if(expanded.has(identity(row)))expanded.delete(identity(row));else expanded.add(identity(row));render();});more.className='am-expand';more.setAttribute('aria-expanded',String(expanded.has(identity(row))));card.append(more);}
      const actions=el('div',null,'am-actions');
      if(trash){actions.append(link('打开文章 ↗',row.path),button('恢复批注',()=>mutate(row,note=>({...note,deletedAt:null,updatedAt:new Date().toISOString()}),'已恢复批注，可在“全部批注”和原文中查看。')));}
      else {actions.append(link('返回原文 ↗',row.path+'#annotation='+encodeURIComponent(n.id)),button('编辑',()=>edit(row)),button('移入回收站',()=>mutate(row,note=>({...note,deletedAt:new Date().toISOString()}),'已移入回收站，可以随时恢复。')));}
      card.append(actions);$('list').append(card);
    }
    if(pages>1){const prev=button('上一页',()=>{page--;render();$('search').focus();}),next=button('下一页',()=>{page++;render();$('search').focus();});prev.disabled=page===1;next.disabled=page===pages;$('pagination').append(prev,el('span',page+' / '+pages),next);}
  }
  function mutate(row,update,message,errorTarget='status') {
    try {
      const notes=read(row.path), current=notes.find(n=>n.id===row.note.id);
      if(!current||revision(current)!==revision(row.note)) { $(errorTarget).textContent='这条批注已在其他页面修改，请保留当前输入，刷新列表后重新编辑。';load();return false; }
      const next=notes.map(n=>n.id===current.id?update(n):n);
      if(!validNotes(next))throw Error('invalid');
      localStorage.setItem(PREFIX+row.path,JSON.stringify({version:1,notes:next}));
      load();say(message);return true;
    }catch{$(errorTarget).textContent='保存失败，浏览器存储可能不可用或已满。原批注未被覆盖，编辑中的内容仍保留。';return false;}
  }
  function edit(row) {
    draft={path:row.path,note:{...row.note}};$('editor-article').textContent=title(row.path);$('editor-quote').textContent=row.note.quote;$('text').value=row.note.text;$('editor-status').textContent='';$('editor').showModal();$('text').focus();
  }
  function discard(){return !draft||$('text').value.trim()===draft.note.text||window.confirm('放弃尚未保存的批注修改？');}
  function close(){if(discard()){$('editor').close();draft=null;}}
  $('close').addEventListener('click',close);$('cancel').addEventListener('click',close);
  $('editor').addEventListener('cancel',e=>{if(!discard())e.preventDefault();else draft=null;});
  $('form').addEventListener('submit',e=>{e.preventDefault();const text=$('text').value.trim();if(!draft||!text||text.length>5000)return;if(mutate(draft,n=>({...n,text,updatedAt:new Date().toISOString()}),'已保存修改，文章旁注也会更新。','editor-status')){$('editor').close();draft=null;}});
  $('search').addEventListener('input',()=>{page=1;render();});$('sort').addEventListener('change',()=>{page=1;render();});$('article').addEventListener('change',()=>setArticle($('article').value));
  $('active').addEventListener('click',()=>{trash=false;page=1;render();});$('trash').addEventListener('click',()=>{trash=true;page=1;render();});
  $('export').addEventListener('click',()=>{
    load();if(failures.length){say('有批注无法读取，暂未导出。请先处理提示，避免备份遗漏。');return;}
    const data={format:'happycat-annotations',version:2,exportedAt:new Date().toISOString(),articles:groups.map(g=>({...g,title:title(g.path)}))};
    const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=link('','');a.href=url;a.download='happycat-all-annotations-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);say('已导出所有文章的批注和回收站内容，请妥善保存备份。');
  });
  $('import').addEventListener('click',()=>$('file').click());
  $('file').addEventListener('change',async()=>{
    const file=$('file').files[0];if(!file)return;
    try {
      if(file.size>20*1024*1024)throw Error('备份不能超过 20 MB。');
      const data=JSON.parse(await file.text());
      let articles;
      if(data.version===1)articles=[{path:data.path,notes:data.notes}];
      else if(data.version===2&&data.format==='happycat-annotations')articles=data.articles;
      else throw Error('不支持的备份格式。请选择文章备份或整站批注备份。');
      if(!Array.isArray(articles)||articles.length>2000||new Set(articles.map(a=>a?.path)).size!==articles.length||!articles.every(a=>a&&validPath(a.path)&&validNotes(a.notes)))throw Error('备份格式无效，未更改任何批注。');
      const plan=[];let added=0,skipped=0;
      for(const a of articles){const old=localStorage.getItem(PREFIX+a.path),existing=read(a.path),merged=new Map(existing.map(n=>[n.id,n]));for(const n of a.notes){if(merged.has(n.id)){skipped++;continue;}merged.set(n.id,n);added++;}if(merged.size>LIMIT)throw Error('合并后单篇文章超过 500 条批注，未导入。');if(merged.size!==existing.length)plan.push({key:PREFIX+a.path,old,value:JSON.stringify({version:1,notes:[...merged.values()]})});}
      const written=[];
      try {for(const step of plan){localStorage.setItem(step.key,step.value);written.push(step);}}
      catch {let failed=false;for(const step of written.reverse()){try{if(step.old===null)localStorage.removeItem(step.key);else localStorage.setItem(step.key,step.old);}catch{failed=true;}}throw Error(failed?'导入中断，部分内容可能已合并。请保留备份，检查存储权限后重新导入；重复批注不会覆盖。':'存储空间不足或不可用，导入已撤回。请保留备份后重试。');}
      load();say('已导入 '+added+' 条批注；保留 '+skipped+' 条已有记录。已有批注及删除状态不会被备份覆盖。');
    }catch(error){load();say(error instanceof SyntaxError?'文件不是有效的 JSON 备份，未更改批注。':error.message==='批注格式无效'?'现有批注数据无法读取，未导入。请先处理上方提示。':error.message);}
    finally{$('file').value='';}
  });
  window.addEventListener('storage',event=>{if(event.key===null||event.key.startsWith(PREFIX))load();});
  window.addEventListener('pageshow',()=>load());
  load();
})();

</script>
